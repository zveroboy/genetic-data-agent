[package]
name = "rust-ingestion-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
rayon = "1.10"
duckdb = { version = "1.1", features = ["bundled", "parquet"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1.0"
temporalio-sdk = "=0.5.0"
temporalio-client = "=0.5.0"
temporalio-common = "=0.5.0"
temporalio-macros = "=0.5.0"
# Required transitively by temporalio-sdk's public API: `Worker::new` takes a
# `&temporalio_sdk_core::CoreRuntime`, which temporalio-sdk does not re-export.
temporalio-sdk-core = "=0.5.0"
# Required by the code generated by `temporalio-macros::activities`, which refers to
# `::futures` in the calling crate.
futures = "0.3"
