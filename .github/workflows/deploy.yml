name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd genetic-data-agent || git clone https://github.com/${{ github.repository }}.git genetic-data-agent
            cd genetic-data-agent
            git pull origin main
            # `docker-compose.prod.yml` is an overlay, not a standalone stack: the six services,
            # their queues and their resource bounds are defined once in `docker-compose.yml`
            # and the overlay only changes what differs away from a laptop. Both files are
            # required, in this order.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker system prune -f
