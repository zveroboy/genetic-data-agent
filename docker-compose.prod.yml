# Deployment overlay, applied on top of `docker-compose.yml`:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# An overlay, not a second copy: the six services, their task queues, their health dependencies
# and the "no shared volume between the languages" rule are defined once, next door, and cannot
# drift. What lives here is everything that should be true of a real deployment and would only
# get in the way on a laptop — isolation, quotas, least privilege, request budgets, and no
# credential defaults.
#
# What this file does **not** claim to give you:
#
# - Temporal still runs `server start-dev`: one node, a SQLite file on a volume, no TLS, no
#   authorization. A real deployment replaces it with `temporalio/auto-setup` (or Temporal Cloud)
#   backed by PostgreSQL/Cassandra and mTLS. That substitution is deliberate work, not a flag.
# - MinIO is a single node with no erasure coding and no replication. Published artifacts are
#   immutable, but they are not durable in any sense a genomics platform should rely on.
# - There is no authentication in front of `/ask`. Any caller that can reach the port can read
#   any published dataset by id.
#
# Ollama is defined but not started by default (`profiles: [literature]`). PubMed literature
# search is the one optional feature: without an embedding endpoint the genotype answer stands
# and the API logs that literature was unavailable.

services:
  temporal:
    restart: unless-stopped
    ports: !override []
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports: !override []
    logging: *bounded-logging

  minio-provision:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      API_READER_ACCESS_KEY: ${API_READER_ACCESS_KEY:?set API_READER_ACCESS_KEY}
      API_READER_SECRET_KEY: ${API_READER_SECRET_KEY:?set API_READER_SECRET_KEY}
    logging: *bounded-logging

  qdrant:
    restart: unless-stopped
    ports: !override []
    logging: *bounded-logging

  # -----------------------------------------------------------------------------------------
  # The API: least privilege, and a bound on every outbound request and every query
  # -----------------------------------------------------------------------------------------
  ts-api:
    restart: unless-stopped
    environment:
      # The scoped identity `minio-provision` creates: `s3:GetObject` under
      # `genomic-artifacts/datasets/` and nothing else. Not the root credentials the local stack
      # uses — the serving path only ever reads a manifest and the objects it declares, so a
      # credential that can do more is a credential that can be made to.
      S3_ACCESS_KEY: ${API_READER_ACCESS_KEY:?set API_READER_ACCESS_KEY}
      S3_SECRET_KEY: ${API_READER_SECRET_KEY:?set API_READER_SECRET_KEY}
      # Request and query budgets. `S3_*_TIMEOUT_MS`/`S3_MAX_ATTEMPTS` bound the API's own
      # HEAD/GET round trips — the AWS SDK's default is *no* request timeout, which is how one
      # half-open socket becomes one hung `/ask`. `DUCKDB_QUERY_DEADLINE_MS` bounds one served
      # question and is enforced by interrupting the connection, not by abandoning a promise.
      S3_REQUEST_TIMEOUT_MS: "5000"
      S3_CONNECT_TIMEOUT_MS: "2000"
      S3_MAX_ATTEMPTS: "3"
      DUCKDB_QUERY_DEADLINE_MS: "10000"
      # Off, and load bearing: the image ships a preinstalled `httpfs`, so a cold container with
      # no Internet must still answer `/ask` rather than fetching an extension mid-request.
      DUCKDB_ALLOW_EXTENSION_INSTALL: "false"
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    ports: !override
      - "127.0.0.1:3000:3000"
    # The API downloads nothing, caches nothing and writes nothing: user variants are read out of
    # remote Parquet with ranged HTTP requests, so the root filesystem can be read-only outright.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 512
    logging: *bounded-logging

  ts-control-worker:
    restart: unless-stopped
    environment:
      # The control plane writes the manifest and reads the seeded sources, so it needs more than
      # the API's read-only identity. It still never writes a Parquet object: the Rust activity
      # uploads those to their final immutable keys.
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_REQUEST_TIMEOUT_MS: "10000"
      S3_CONNECT_TIMEOUT_MS: "2000"
      S3_MAX_ATTEMPTS: "3"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 512
    logging: *bounded-logging

  # -----------------------------------------------------------------------------------------
  # The data plane: bounded CPU, memory and temp disk
  # -----------------------------------------------------------------------------------------
  rust-ingestion-worker:
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    # All three are real limits, not decoration: ingestion stages a whole genome through local
    # DuckDB before exporting Parquet, so a source large enough to exceed them fails this
    # container instead of the host.
    #
    # The two size numbers are related, which is easy to get wrong: a `tmpfs` is memory-backed,
    # so every byte written to the staging mount counts against `mem_limit`. The staging cap is
    # therefore deliberately *below* the memory limit — 2 GB of staging plus ~2 GB of working
    # memory — rather than a larger figure that could never actually be filled. For scale, the
    # full NA12878/HG001 ingest (3,893,341 variants) stages a few hundred megabytes.
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 512
    read_only: true
    tmpfs:
      # A *private* tmpfs — deliberately not a named volume, and deliberately not shared with any
      # TypeScript container. Nothing outside this process ever reads a path it writes; the
      # artifact leaves as S3 objects.
      - /var/lib/ingestion:size=2g,mode=1777
      - /tmp:size=64m
    logging: *bounded-logging

  # Optional: `docker compose --profile literature up -d ollama`. Not part of the ingestion or
  # serving path — `search_medical_literature` degrades to "unavailable" without it.
  ollama:
    image: ollama/ollama:latest
    container_name: genomic-ollama
    profiles: ["literature"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    logging: *bounded-logging

volumes:
  ollama-data:
