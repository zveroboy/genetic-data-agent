version: '3.8'

services:
  temporal:
    image: temporalio/auto-setup:latest
    container_name: temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=sqlite
      - DB_FILENAME=/root/temporal.sqlite
    volumes:
      - temporal-data:/root

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ts-api-agent:
    build:
      context: .
      dockerfile: ts-api-agent/Dockerfile
    container_name: ts-api-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TEMPORAL_HOST=temporal:7233
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-password123}
    volumes:
      - shared-genomic-data:/app/data

  ts-worker:
    build:
      context: .
      dockerfile: ts-api-agent/Dockerfile
    container_name: ts-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      - TEMPORAL_HOST=temporal:7233
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - shared-genomic-data:/app/data

  # Cloudflare Tunnel (Zero Open Inbound Ports + Free SSL)
  # Uncomment once you set your Cloudflare Tunnel Token in .env
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  temporal-data:
  qdrant-data:
  minio-data:
  ollama-data:
  shared-genomic-data:
